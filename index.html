<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ジャグラー設定判別</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ジャグ判別">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29); --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2);
  --blue:#007aff; --pink:#ff2d55; --green:#34c759; --orange:#ff9500; --red:#ff3b30; --purple:#af52de;
  --navbg:rgba(242,242,247,.8);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1c1c1e; --label:#ffffff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.65); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
    --blue:#0a84ff; --pink:#ff375f; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --purple:#bf5af2;
    --navbg:rgba(0,0,0,.75); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --label:#ffffff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --blue:#0a84ff; --pink:#ff375f; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --purple:#bf5af2;
  --navbg:rgba(0,0,0,.75); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;font-size:17px;line-height:1.35;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
button{font-family:inherit}
input,select{font-family:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}



/* group (inset grouped list) */
.hdr{font-size:13px;color:var(--label2);margin:22px 16px 6px;letter-spacing:.02em}
.ftr{font-size:13px;color:var(--label2);margin:6px 16px 0;line-height:1.4}
.group{background:var(--card);border-radius:10px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 16px;position:relative}
.cell+.cell::before,.cell+details::before,details+.cell::before,details+details::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
details{position:relative}
.cell .lbl{flex:1;min-width:0}
.cell .lbl small{display:block;font-size:13px;color:var(--label2);margin-top:1px}
.cell .val{color:var(--label2);text-align:right}
.textin{flex:1;min-width:0;border:0;background:transparent;color:var(--label);font-size:17px;padding:0;outline:none}
.textin::placeholder{color:var(--label3)}
.danger{color:var(--red);background:none;border:0;font-size:17px;padding:0;cursor:pointer}

/* picker row */
.picker{position:relative}
.picker select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;font-size:17px}
.chev::after{content:"";display:inline-block;width:8px;height:8px;border-right:2px solid var(--label3);border-bottom:2px solid var(--label3);transform:rotate(-45deg);margin-left:8px;position:relative;top:-1px}

/* hero */
.hero{background:var(--card);border-radius:16px;padding:16px}
.est{display:flex;align-items:center;gap:16px}
.estL{flex:0 0 auto;text-align:center;min-width:110px}
.estL small,.estR small{font-size:13px;color:var(--label2)}
.estN{font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--label3)}
.estN.s6,.estN.s5{color:var(--pink)}.estN.s4{color:var(--purple)}.estN.s1,.estN.s2,.estN.s3{color:var(--blue)}
.estR{flex:1;min-width:0;border-left:.5px solid var(--sep);padding-left:16px}
.estP{font-size:40px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.estP small{font-size:20px}
.est2{font-size:13px;color:var(--label2);margin-top:2px}
.vrow{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:.5px solid var(--sep)}
.vword{font-size:17px;font-weight:700;padding:6px 14px;border-radius:10px;background:var(--fill);color:var(--label2)}
.vword.pos{background:rgba(52,199,89,.16);color:var(--green)}.vword.mid{background:rgba(255,149,0,.16);color:var(--orange)}.vword.neg{background:rgba(255,59,48,.14);color:var(--red)}
.vev{font-size:15px;color:var(--label2)}
.vev b{font-size:20px;color:var(--label);font-variant-numeric:tabular-nums}
.vev b.pos{color:var(--green)}.vev b.neg{color:var(--red)}.vev b.mid{color:var(--orange)}
.vnote{font-size:13px;color:var(--label2);margin-top:10px;line-height:1.45}
.vnote:empty{display:none}

/* stepper rows */
.srow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 12px;padding:10px 16px;position:relative}
.srow+.srow::before,.srow+.cell::before,.cell+.srow::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.srow .name{font-size:17px}
.srow .name small{display:block;font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;gap:10px}
.ctl input{width:70px;text-align:right;border:0;background:transparent;color:var(--label);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;padding:0;outline:none}
.ctl input::placeholder{color:var(--label3);font-weight:400}
.ctl input:disabled{opacity:.4}
.stepper{display:flex;gap:8px}
.stepper button{width:50px;height:44px;border:0;border-radius:12px;background:var(--fill);color:var(--label);font-size:26px;font-weight:500;line-height:1;cursor:pointer;touch-action:manipulation;transition:transform .06s}
.stepper button+button{background:rgba(0,122,255,.14);color:var(--blue)}
.stepper button:active{transform:scale(.92);background:var(--fill2)}
.stepper button:disabled{color:var(--label3);background:var(--fill)}
.quick{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.quick button{height:36px;min-width:56px;padding:0 12px;border-radius:18px;border:0;background:var(--fill);color:var(--blue);font-size:15px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums;touch-action:manipulation}
.quick button:active{background:var(--fill2);transform:scale(.95)}

/* disclosure */
summary{list-style:none;cursor:pointer;display:flex;align-items:center;min-height:44px;padding:8px 16px;gap:12px}
summary::-webkit-details-marker{display:none}
summary .lbl{flex:1}
summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--label3);border-bottom:2px solid var(--label3);transform:rotate(-45deg);transition:transform .2s}
details[open]>summary::after{transform:rotate(45deg)}
.inner{padding:0 0 4px}
.inner .note{font-size:13px;color:var(--label2);padding:0 16px 8px;margin:0;line-height:1.45}
.result{margin:4px 16px 10px;padding:10px 12px;border-radius:10px;background:var(--fill);font-size:15px;line-height:1.45}

/* segmented control */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:0}
.seg button{flex:1;height:30px;border:0;border-radius:7px;background:transparent;color:var(--label);font-size:13px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
.segcell{padding:10px 16px}

/* switch */
.switch{position:relative;width:51px;height:31px;flex:0 0 auto}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:16px;background:var(--fill2);transition:background .2s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .2s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(20px)}

/* bars */
.bars{padding:6px 16px 10px}
.bar{display:grid;grid-template-columns:48px 1fr 54px;align-items:center;gap:10px;height:32px}
.bl{font-size:15px}
.bv{text-align:right;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.track{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.fill{height:100%;border-radius:4px;background:var(--blue);width:0;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.hi .fill{background:var(--pink)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{background:var(--card);border-radius:12px;padding:12px 14px}
.tile .k{font-size:13px;color:var(--label2)}
.tile .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:15px;font-weight:600;margin-left:1px}
.inlinein{width:72px;text-align:right;border:0;background:transparent;color:var(--blue);font-size:17px;padding:0;outline:none;font-variant-numeric:tabular-nums}

.chart{padding:10px 8px 6px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-size:10px;fill:var(--label2);font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--sep);stroke-width:.5}
.chart .zero{stroke:var(--label3);stroke-width:1}
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
.carousel::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;padding:12px 8px 4px;min-width:0}
.slide .st{display:flex;justify-content:space-between;align-items:baseline;margin:0 8px 6px;gap:8px}
.slide .st b{font-size:15px;font-weight:600}
.slide .st span{font-size:12px;color:var(--label2);font-variant-numeric:tabular-nums}
.slide svg{width:100%;height:auto;display:block;overflow:visible}
.slide text{font-size:10px;fill:var(--label2);font-variant-numeric:tabular-nums}
.slide .grid{stroke:var(--sep);stroke-width:.5}
.slide .zero{stroke:var(--label3);stroke-width:1}
.slide .cap{font-size:13px;color:var(--label2);margin:6px 8px 0;line-height:1.45;min-height:1.45em}
.dots{display:flex;justify-content:center;gap:6px;padding:6px 0 10px;flex-wrap:wrap}
.dots button{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--fill2);cursor:pointer}
.dots button.on{background:var(--label);width:18px;border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:4px 16px 12px;font-size:12px;color:var(--label2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.guide p{margin:0;padding:11px 16px;font-size:15px;line-height:1.45;position:relative}
.guide p+p::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}

.tblwrap{overflow-x:auto;padding:0 16px 10px}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;text-align:right;border-bottom:.5px solid var(--sep)}
th:first-child,td:first-child{text-align:left}
th{color:var(--label2);font-weight:600}
.src{padding:0 16px 10px;font-size:13px;color:var(--label2);line-height:1.6}
.src p{margin:0 0 8px}
.src b{color:var(--label);font-weight:600}
.btnrow{margin-top:22px;background:var(--card);border-radius:10px}
.btnrow button{width:100%;height:44px;border:0;background:transparent;color:var(--red);font-size:17px;cursor:pointer}
footer{font-size:12px;color:var(--label2);margin:16px 16px 0;line-height:1.5}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.acctbtn{border:0;background:none;color:var(--blue);font-size:17px;padding:0;cursor:pointer;font-family:inherit}
.acctbtn:disabled{color:var(--label3)}
#acctSub.ok{color:var(--green)}#acctSub.warn{color:var(--orange)}#acctSub.err{color:var(--red)}
dialog#authDlg{border:0;border-radius:14px;padding:16px;width:min(92vw,420px);background:var(--bg);color:var(--label);box-shadow:0 10px 40px rgba(0,0,0,.35)}
dialog#authDlg::backdrop{background:rgba(0,0,0,.4)}
.dlghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.dlghead b{font-size:20px}
.autherr{color:var(--red);font-size:14px;min-height:1.2em;margin:10px 4px}
.primary{width:100%;height:50px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit}
.primary:disabled{opacity:.5}

/* filter chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;height:34px;padding:0 14px;border-radius:17px;border:0;background:var(--card);color:var(--label);font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
.chips button[aria-selected="true"]{background:var(--blue);color:#fff}
.prow{display:flex;align-items:center;gap:10px;padding:6px 16px;position:relative}
.prow+.prow::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.prow .pg{flex:1;font-size:16px;font-variant-numeric:tabular-nums}
.prow .sgn{width:44px;height:36px;border:0;border-radius:9px;background:var(--fill);font-size:20px;font-weight:600;cursor:pointer;color:var(--green)}
.prow .sgn.m{color:var(--red)}
.prow input{width:96px;height:36px;border:0;border-radius:9px;background:var(--fill);color:var(--label);font:inherit;font-size:17px;text-align:right;padding:0 10px;font-variant-numeric:tabular-nums}
.prow .u{font-size:15px;color:var(--label2)}
.hap{position:absolute;inset:0;border-radius:inherit;cursor:pointer;opacity:.011;overflow:hidden;z-index:2}
.hap input{position:absolute;inset:0;margin:0;width:100%;height:100%;cursor:pointer}
.stepper button,.quick button,.sgn,#recBtn,.dayq button,.dsgn,button:has(>.hap){position:relative}
/* calendar */
.calcard{background:var(--card);border-radius:16px;padding:10px 8px 8px;margin-top:6px}
.calhead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
.calhead b{font-size:18px}
.calnav{width:40px;height:36px;border:0;border-radius:10px;background:var(--fill);color:var(--blue);font-size:24px;line-height:1;cursor:pointer}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.calgrid .wd{text-align:center;font-size:12px;color:var(--label2);padding:2px 0 4px}
.calgrid .wd.sun{color:var(--red)}.calgrid .wd.sat{color:var(--blue)}
.cday{position:relative;min-height:54px;border:0;border-radius:9px;background:transparent;color:var(--label);font:inherit;display:flex;flex-direction:column;align-items:center;padding:5px 0 3px;cursor:pointer;gap:1px}
.cday:active{background:var(--fill)}
.cday .dn{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.cday.sun .dn{color:var(--red)}.cday.sat .dn{color:var(--blue)}
.cday .dy{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cday.has{background:var(--fill)}
.cday.today{box-shadow:inset 0 0 0 2px var(--blue)}
.cday .rd{width:5px;height:5px;border-radius:3px;background:var(--purple);margin-top:auto}
.cday.out{visibility:hidden}
.calper{margin:12px 0 0}
.calper button{height:34px;font-size:14px}
.calsum{margin-top:10px}
.sumhero{background:var(--card);border-radius:16px;padding:16px;text-align:center}
.sumhero small{font-size:13px;color:var(--label2)}
.sumhero .big{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px;border-top:.5px solid var(--sep);padding-top:10px}
.sumgrid>div+div{border-left:.5px solid var(--sep)}
.sumgrid .k{font-size:12px;color:var(--label2)}.sumgrid .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.sumset{background:var(--card);border-radius:16px;padding:14px 16px;margin-top:10px}
.sumset .row1{display:flex;justify-content:space-between;align-items:baseline}
.sumset .row1 small{font-size:13px;color:var(--label2)}
.sumset .es{font-size:34px;font-weight:800;color:var(--pink);font-variant-numeric:tabular-nums}
.sumset .rates{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.sumset .rates>div{background:var(--fill);border-radius:10px;padding:6px 4px;text-align:center}
.sumset .rates .k{font-size:11px;color:var(--label2)}.sumset .rates .v{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.dayform{background:var(--card);border-radius:14px;padding:14px 16px}
.dayt{text-align:center;font-size:15px;font-weight:600;margin-bottom:10px}
.dfield{display:flex;align-items:center;gap:10px;margin-top:10px}
.dfield label{width:44px;font-size:17px;font-weight:600}
.dfield input{flex:1;min-width:0;height:50px;border:0;border-radius:12px;background:var(--fill);color:var(--label);font:inherit;font-size:26px;font-weight:700;text-align:right;padding:0 12px;font-variant-numeric:tabular-nums}
.dfield .u{font-size:16px;color:var(--label2)}
.dres{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:10px;border-top:.5px solid var(--sep)}
.dres span{font-size:15px;color:var(--label2)}.dres b{font-size:26px;font-variant-numeric:tabular-nums}
.dayrow{display:flex;align-items:center;gap:10px}
.dsgn{width:56px;height:52px;border:0;border-radius:12px;background:rgba(52,199,89,.16);color:var(--green);font-size:28px;font-weight:600;cursor:pointer}
.dsgn.m{background:rgba(255,59,48,.14);color:var(--red)}
#dayYen{flex:1;min-width:0;height:52px;border:0;border-radius:12px;background:var(--fill);color:var(--label);font:inherit;font-size:28px;font-weight:700;text-align:right;padding:0 12px;font-variant-numeric:tabular-nums}
.dayrow .u{font-size:17px;color:var(--label2)}
.dayq{display:flex;gap:8px;margin-top:8px;margin-bottom:6px}
.dayq button{flex:1;height:38px;border:0;border-radius:19px;background:var(--fill);color:var(--blue);font-size:15px;font-weight:600;cursor:pointer}
.dayrec{font-size:13px;color:var(--label2);margin-top:10px;line-height:1.5}
.dayrec:empty{display:none}
.daysave{display:block;width:100%;height:50px;margin-top:12px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;cursor:pointer}
.daydel{display:block;width:100%;height:40px;margin-top:6px;border:0;background:none;color:var(--red);font-size:15px;cursor:pointer}
.caltitle{border:0;background:none;color:var(--label);font:inherit;font-size:18px;font-weight:700;cursor:pointer;padding:4px 10px;border-radius:10px}
.caltitle::after{content:"";display:inline-block;width:7px;height:7px;border-right:2px solid var(--blue);border-bottom:2px solid var(--blue);transform:translateY(-3px) rotate(45deg);margin-left:8px;transition:transform .2s}
.caltitle[aria-expanded="true"]::after{transform:translateY(1px) rotate(-135deg)}
.mpick{padding:4px 4px 10px;border-bottom:.5px solid var(--sep);margin-bottom:8px;animation:fade .2s}
.mpy{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mpy b{font-size:16px}
.mpg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mpg button{height:40px;border:0;border-radius:10px;background:var(--fill);color:var(--label);font-size:15px;font-weight:600;cursor:pointer}
.mpg button.on{background:var(--blue);color:#fff}
.mpg button .ms{display:block;font-size:10px;font-weight:600;margin-top:-2px}
.cday.sel{background:var(--blue)!important;color:#fff}
.cday.sel .dn,.cday.sel .dy{color:#fff!important}
.cday.sel .rd{background:#fff}
.ivrt{font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums;margin-top:2px}
.dayedit{display:block;margin:12px auto 0;height:40px;padding:0 22px;border:0;border-radius:20px;background:var(--blue);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
/* app shell */
[hidden]{display:none!important}
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:8px 20px 8px;background:var(--navbg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.nav h1{font-size:28px;font-weight:700;margin:0;letter-spacing:.01em}
.navr{display:flex;gap:10px;align-items:center}
.navbtn{border:0;background:var(--fill);color:var(--blue);font-size:15px;font-weight:600;height:32px;padding:0 16px;border-radius:16px;cursor:pointer}
.navbtn.done{background:var(--green);color:#fff}
.navic{width:32px;height:32px;border:0;border-radius:16px;background:var(--fill);color:var(--blue);display:grid;place-items:center;cursor:pointer;padding:0}
.navic svg{width:18px;height:18px;fill:currentColor}
.sheetbg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:560px;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sgrp{background:var(--card);border-radius:14px;overflow:hidden}
.stitle{font-size:13px;color:var(--label2);text-align:center;padding:12px 16px}
.stitle:empty{display:none}
.sgrp button,.scancel{display:block;width:100%;height:57px;border:0;background:var(--card);color:var(--blue);font-size:20px;cursor:pointer;border-top:.5px solid var(--sep)}
.sgrp button.red{color:var(--red)}
.sacct{margin-top:8px}
.sacct .stitle{display:block}
.sacct #acctSub{display:block;text-align:center;font-size:13px;margin:0;padding:12px 16px}
.scancel{margin-top:8px;border-radius:14px;font-weight:600;border:0}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(100%)}}
.wrap{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
.view>:first-child{margin-top:6px}
#recList>.hdr:first-child{margin-top:10px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:var(--navbg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;max-width:186px;border:0;background:none;color:var(--label2);font-size:10px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;cursor:pointer;position:relative}
.tabbar svg{width:26px;height:26px}
.tabbar button[aria-selected="true"]{color:var(--blue)}
.badge{position:absolute;top:3px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:600;line-height:17px}
.actbar{display:flex;gap:10px;margin-top:12px}
.abtn{height:48px;border:0;border-radius:14px;font-size:17px;font-weight:600;cursor:pointer;}
.abtn.sub{flex:0 0 34%;background:var(--card);color:var(--red);border:.5px solid var(--sep)}
.abtn.main{flex:1;background:var(--blue);color:#fff}
.abtn.main.done{background:var(--green)}
.editbar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.ebic{color:var(--green);font-size:12px}
.ebtx{flex:1;display:flex;flex-direction:column;font-size:15px}
.ebtx small{font-size:12px;color:var(--label2)}
#recAt{border:0;background:var(--fill);color:var(--label);font:inherit;font-size:15px;border-radius:8px;padding:6px 8px;max-width:190px}
.lsum{display:flex;gap:10px;margin:6px 0 4px}
.lsum>div{flex:1;background:var(--card);border-radius:12px;padding:10px 14px}
.lsum .k{font-size:12px;color:var(--label2)}.lsum .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.rec{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;color:var(--label);padding:11px 16px;cursor:pointer;position:relative;font:inherit}
.sw+.sw .rec::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.sw{position:relative;overflow:hidden}
.swdel{position:absolute;top:0;right:0;bottom:0;width:100%;border:0;background:var(--red);color:#fff;font-size:17px;font-weight:600;text-align:right;padding-right:22px;cursor:pointer;visibility:hidden}
.sw.sl .swdel{visibility:visible}
.rec{background:var(--card);touch-action:pan-y;z-index:1;will-change:transform}
.rec.anim{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sw.gone{transition:height .25s ease,opacity .25s;opacity:0}
.rec .tm{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;width:44px;flex:0 0 auto}
.rec .md{flex:1;min-width:0}
.rec .md b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .md small{display:block;font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .sc{text-align:right;flex:0 0 auto}
.rec .sc b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.rec .sc small{font-size:12px;color:var(--label2)}
.rec.on{background:rgba(52,199,89,.12)}
.pos{color:var(--green)}.neg{color:var(--red)}.mid{color:var(--orange)}
.empty{text-align:center;color:var(--label2);padding:60px 20px;font-size:15px;line-height:1.6}
.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:40;background:rgba(40,40,42,.94);color:#fff;border-radius:14px;padding:11px 16px;font-size:15px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:#64d2ff;font-size:15px;font-weight:600;padding:0;cursor:pointer}
</style>
</head>
<body>
<header class="nav"><h1 id="navTitle">判別</h1><div class="navr" id="navR"><button type="button" class="navic" id="moreBtn" aria-label="その他の操作"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button><button type="button" class="navbtn" id="recBtn">記録</button></div></header>
<div class="sheetbg" id="sheet" hidden><div class="sheet" role="dialog" aria-label="操作"><div class="sgrp"><div class="stitle" id="sheetT"></div><button type="button" id="clearBtn">入力をクリア</button><button type="button" class="red" id="delBtn">この記録を削除</button></div><div class="sgrp sacct"><div class="stitle" id="acctSub">ログインで記録をクラウド保存</div><button type="button" id="acctBtn">ログイン</button></div><button type="button" class="scancel" id="sheetX">キャンセル</button></div></div>
<div class="wrap">
<section class="view" id="vMain">
  <div class="editbar" id="editBar" hidden>
    <span class="ebic" aria-hidden="true">●</span>
    <span class="ebtx"><b>記録を編集中</b><small>変更は自動で保存されます</small></span>
    <input type="datetime-local" id="recAt" aria-label="記録の日時">
  </div>
  <div class="group">
    <div class="cell picker">
      <span class="lbl">機種</span>
      <span class="val chev" id="modelName"></span>
      <select id="model" aria-label="機種"></select>
    </div>
    <div class="cell"><input class="textin" id="tname" maxlength="16" placeholder="台番号・メモ" aria-label="台番号・メモ"></div>
  </div>
  <div class="hdr">判別結果</div>
  <div class="hero" aria-live="polite">
    <div class="est">
      <div class="estL"><small>推定設定</small><div class="estN" id="estN">–</div></div>
      <div class="estR"><small>信頼度</small><div class="estP" id="estP">–</div><div class="est2" id="est2"></div></div>
    </div>
    <div class="vrow"><span class="vword" id="vword">–</span><span class="vev">期待割 <b id="vev">–</b></span></div>
    <div class="vnote" id="verdict">総回転数・BIG・REGを入力</div>
  </div>

  
  <div class="hdr">台データ</div>
  <div class="group">
    <div class="srow">
      <label class="name" for="g">総回転数</label>
      <div class="ctl"><input id="g" type="number" inputmode="numeric" min="0" placeholder="0"><div class="stepper"><button type="button" data-t="g" data-d="-100" aria-label="100減らす">−</button><button type="button" data-t="g" data-d="100" aria-label="100増やす">＋</button></div></div>
      <div class="quick"><button type="button" data-t="g" data-d="10">+10</button><button type="button" data-t="g" data-d="50">+50</button><button type="button" data-t="g" data-d="100">+100</button><button type="button" data-t="g" data-d="1000">+1000</button></div>
    </div>
    <div class="srow">
      <label class="name" for="b">BIG<small id="rb">–</small></label>
      <div class="ctl"><input id="b" type="number" inputmode="numeric" min="0" placeholder="0"><div class="stepper"><button type="button" data-t="b" data-d="-1" aria-label="1減らす">−</button><button type="button" data-t="b" data-d="1" aria-label="1増やす">＋</button></div></div>
    </div>
    <div class="srow">
      <label class="name" for="r">REG<small id="rr">–</small></label>
      <div class="ctl"><input id="r" type="number" inputmode="numeric" min="0" placeholder="0"><div class="stepper"><button type="button" data-t="r" data-d="-1" aria-label="1減らす">−</button><button type="button" data-t="r" data-d="1" aria-label="1増やす">＋</button></div></div>
    </div>
  </div>
  <p class="ftr" id="rc2"></p>

  
  <div class="hdr">追加データ(任意)</div>
  <div class="group">
    <div class="srow">
      <label class="name" for="diff">差枚<small>マイナスも可</small></label>
      <div class="ctl"><input id="diff" type="number" inputmode="text" placeholder="0"><div class="stepper"><button type="button" data-t="diff" data-d="-10" data-neg="1" aria-label="10減らす">−</button><button type="button" data-t="diff" data-d="10" data-neg="1" aria-label="10増やす">＋</button></div></div>
      <div class="quick"><button type="button" data-t="diff" data-d="-100" data-neg="1">−100</button><button type="button" data-t="diff" data-d="100" data-neg="1">+100</button><button type="button" data-t="diff" data-d="500" data-neg="1">+500</button></div>
    </div>
    <div class="result" id="revOut" hidden></div>
    <div class="srow">
      <label class="name" for="gr">ブドウ<small id="rg">–</small></label>
      <div class="ctl"><input id="gr" type="number" inputmode="numeric" min="0" placeholder="0"><div class="stepper"><button type="button" data-t="gr" data-d="-1" aria-label="1減らす">−</button><button type="button" data-t="gr" data-d="1" aria-label="1増やす">＋</button></div></div>
      <div class="quick"><button type="button" data-t="gr" data-d="5">+5</button><button type="button" data-t="gr" data-d="10">+10</button></div>
    </div>
    <div class="srow">
      <label class="name" for="gst">数え始めのG数<small id="gstInfo">途中から数えたときだけ</small></label>
      <div class="ctl"><input id="gst" type="number" inputmode="numeric" min="0" placeholder="0"><div class="stepper"><button type="button" data-t="gst" data-d="-100" aria-label="100減らす">−</button><button type="button" data-t="gst" data-d="100" aria-label="100増やす">＋</button></div></div>
      <div class="quick"><button type="button" data-t="gst" data-d="500">+500</button><button type="button" data-t="gst" data-d="1000">+1000</button></div>
    </div>
    <div class="srow" id="rowNc">
      <label class="name" for="nc">チェリー<small id="rnc">–</small></label>
      <div class="ctl"><input id="nc" type="number" inputmode="numeric" min="0" placeholder="0"><div class="stepper"><button type="button" data-t="nc" data-d="-1" aria-label="1減らす">−</button><button type="button" data-t="nc" data-d="1" aria-label="1増やす">＋</button></div></div>
    </div>
    <div class="srow" id="rowRs">
      <label class="name" for="rc">チェリーREG<small id="rsInfo"></small></label>
      <div class="ctl"><input id="rc" type="number" inputmode="numeric" min="0" placeholder="0"><div class="stepper"><button type="button" data-t="rc" data-d="-1" aria-label="1減らす">−</button><button type="button" data-t="rc" data-d="1" aria-label="1増やす">＋</button></div></div>
    </div>
    <div class="srow" id="rowBs">
      <label class="name" for="bc">チェリーBIG<small id="bsInfo"></small></label>
      <div class="ctl"><input id="bc" type="number" inputmode="numeric" min="0" placeholder="0"><div class="stepper"><button type="button" data-t="bc" data-d="-1" aria-label="1減らす">−</button><button type="button" data-t="bc" data-d="1" aria-label="1増やす">＋</button></div></div>
    </div>
  </div>
  <div hidden aria-hidden="true">
    <input id="gg"><input id="rs"><input id="bs"><input type="checkbox" id="useRev"><input id="ig"><input id="ib"><input id="ir"><textarea id="ilist"></textarea>
    <span id="regNote"></span><span id="bigNote"></span><span id="ncNote"></span><span id="islandOut"></span><span id="priorline"></span><span id="splitMsg"></span><span id="bigMsg"></span><span id="rg_old"></span>
  </div>

  
  <div class="hdr">設定ごとの可能性</div>
  <div class="group"><div class="bars" id="bars"></div></div>
  <div class="tiles">
    <div class="tile"><div class="k">期待設定</div><div class="v" id="es">–</div></div>
    <div class="tile"><div class="k">期待機械割</div><div class="v" id="ev">–</div></div>
    <div class="tile"><div class="k">期待差枚/時</div><div class="v" id="eh">–</div></div>
    <div class="tile"><div class="k">期待収支/時</div><div class="v" id="ey">–</div></div>
        <div class="tile"><div class="k">現在の機械割</div><div class="v" id="ecur">–</div></div>
  </div>
  
  <div class="hdr">予想グラフ</div>
  <div class="group">
    <div class="carousel" id="chart" role="region" aria-label="予想グラフ(左右にスワイプ)"></div>
    <div class="dots" id="dots"></div>
    <details id="dPath"><summary><span class="lbl">途中経過(1000Gごとの差枚)</span></summary>
      <div id="pathRows"></div><textarea id="path" hidden></textarea>
    </details>
  </div>
  <p class="ftr" id="chartNote"></p>

  
  <div class="hdr">REGの目標</div>
  <div class="group guide" id="guide"><p>データを入れると表示されます</p></div>

  


  


  

  
  <div class="hdr">資料</div>
  <div class="group">
    <details>
      <summary><span class="lbl" id="specSum">この機種の確率表</span></summary>
      <div class="tblwrap"><table id="spec"></table></div>
      <p class="src" id="specNote"></p>
    </details>
  </div>

  
  <p class="ftr" style="margin-top:14px">数値:メーカー公表値・ガリぞう氏調査値。結果は確率的な推測です。</p>
</section>
<section class="view" id="vCal" hidden>
  <div class="calcard">
    <div class="calhead"><button type="button" class="calnav" id="calPrev" aria-label="前の月">‹</button><button type="button" class="caltitle" id="calTitle" aria-expanded="false"></button><button type="button" class="calnav" id="calNext" aria-label="次の月">›</button></div>
    <div class="mpick" id="mPick" hidden><div class="mpy"><button type="button" class="calnav" id="mpPrev" aria-label="前の年">‹</button><b id="mpYear"></b><button type="button" class="calnav" id="mpNext" aria-label="次の年">›</button></div><div class="mpg" id="mpGrid"></div></div>
    <div class="calgrid" id="calGrid"></div>
  </div>
  <div class="seg calper" id="calPer" role="group" aria-label="集計期間">
    <button type="button" data-p="day" id="perDay">今日</button><button type="button" data-p="week">今週</button><button type="button" data-p="month" aria-pressed="true">この月</button><button type="button" data-p="year">今年</button><button type="button" data-p="all">通算</button>
  </div>
  <div class="calsum" id="calSum"></div>
</section>
<section class="view" id="vList" hidden>
  <div class="group" id="fgrp"><div class="cell picker"><span class="lbl">機種</span><span class="val chev" id="fname">すべて</span><select id="fsel" aria-label="機種で絞り込み"></select></div></div>
  <div id="recList"></div>
</section>
</div>
<nav class="tabbar" role="tablist">

  </div>
  <button type="button" class="scancel" id="dayX">キャンセル</button>
</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastTx"></span><button type="button" id="toastAct" hidden></button></div>

/* ---------- priors ---------- */
function parseList(){
  return (S.ilist||"").split(/\n/).map(l=>l.trim().split(/[\s,、]+/).map(Number)).filter(a=>a.length>=3&&a.slice(0,3).every(v=>Number.isFinite(v)&&v>=0)&&a[0]>0&&a[1]+a[2]<=a[0]).map(a=>({G:a[0],B:a[1],R:a[2]}));
}
function emPrior(m,rows){
  const L=rows.map(r=>{const l=[];for(let i=0;i<6;i++){const pb=1/m.b[i],pr=1/m.r[i];l.push(r.B*Math.log(pb)+r.R*Math.log(pr)+(r.G-r.B-r.R)*Math.log(1-pb-pr))}const mx=Math.max(...l);return l.map(v=>Math.exp(v-mx))});
  let pi=[1,1,1,1,1,1].map(v=>v/6);
  for(let it=0;it<500;it++){
    const acc=[0,0,0,0,0,0];
    L.forEach(l=>{let s=0;const q=l.map((v,i)=>{const w=v*pi[i];s+=w;return w});q.forEach((w,i)=>acc[i]+=w/s)});
    const n=rows.length+3;pi=acc.map(a=>(a+0.5)/n);
  }
  const tG=rows.reduce((a,r)=>a+r.G,0),tB=rows.reduce((a,r)=>a+r.B,0),tR=rows.reduce((a,r)=>a+r.R,0);
  return {p:pi,G:tG,B:tB,R:tR,clipped:false,em:rows.length};
}
function islandPrior(m){
  const rows=parseList();
  if(rows.length>=3)return emPrior(m,rows);
  const G=nonneg(S.ig),R=nonneg(S.ir),B=nonneg(S.ib);
  if(!G||R===null||G<1000)return null;
  const x=m.r.map(r=>1/r);
  const lo=Math.min(...x),hi=Math.max(...x);
  let t=R/G;const clipped=t<=lo||t>=hi;
  t=Math.min(Math.max(t,lo+1e-7),hi-1e-7);
  const meanAt=l=>{const mx=Math.max(...x.map(v=>l*v));const w=x.map(v=>Math.exp(l*v-mx));const s=w.reduce((a,c)=>a+c,0);return {p:w.map(v=>v/s),m:w.reduce((a,c,i)=>a+c*x[i],0)/s}};
  let a=-200000,b=200000;
  for(let i=0;i<200;i++){const c=(a+b)/2;if(meanAt(c).m<t)a=c;else b=c}
  return {p:meanAt((a+b)/2).p,G,B,R,clipped};
}
function neutralPrior(m,t){
  const W=m.wo,target=100;
  const lo=Math.min(...W),hi=Math.max(...W);
  if(target<=lo||target>=hi)return [1,1,1,1,1,1];
  const meanAt=l=>{const mx=Math.max(...W.map(v=>l*v));const w=W.map(v=>Math.exp(l*v-mx));const s=w.reduce((a,c)=>a+c,0);return {p:w.map(v=>v/s),m:w.reduce((a,c,i)=>a+c*W[i],0)/s}};
  let a=-50,b=50;for(let i=0;i<200;i++){const c=(a+b)/2;if(meanAt(c).m<target)a=c;else b=c}
  return meanAt((a+b)/2).p;
}
function evPosterior(t){
  const m=MODELS[t.model];
  if(islandPrior(m))return {d:posterior(t),basis:"island"};
  return {d:posterior(t,false,neutralPrior(m,t)),basis:"neutral"};
}
function getPrior(m){
  const ip=islandPrior(m);return ip?{p:ip.p,ip}:{p:PRESETS.even,ip:null};
}

/* ---------- grape reverse calc ---------- */
function reverseGrape(t,m,G,B,R){
  const d=toNum(t.diff);if(d===null||!G)return null;
  const cf=t.style==="free"?2/3:1;
  const cap=t.style==="full"?[1,1]:[0.222,0.101];
  const other=B*(m.bn-0.75)+R*(96-0.75)+G*(3/7.3)+G*(m.cp*cf/m.ch)+G*(14*cap[0]/m.bp+10*cap[1]/m.pp);
  const grapes=(d+3*G-other)/8;
  const pr=1/7.3,pc=cf/m.ch;
  const pbe=cap[0]/m.bp,ppi=cap[1]/m.pp;
  const sd=Math.sqrt(9*G*pr*(1-pr)+m.cp*m.cp*G*pc*(1-pc)+196*G*pbe*(1-pbe)+100*G*ppi*(1-ppi)+40*40)/8;
  return {grapes,sd};
}

/* ---------- core ---------- */
function posterior(t,bonusOnly,priorOverride){
  const m=MODELS[t.model];
  const G=nonneg(t.g),B=nonneg(t.b),R=nonneg(t.r);
  if(G===null||B===null||R===null||G<=0||B+R>G)return null;
  const pr=priorOverride||getPrior(m).p;const ps=pr.reduce((a,c)=>a+c,0);
  let RS,RC;{const c=nonneg(t.rc),s0=nonneg(t.rs);if(c!==null){RC=c<=R?c:null;RS=RC!==null?R-RC:null}else if(s0!==null){RS=s0<=R?s0:null;RC=RS!==null?R-RS:null}else{RS=null;RC=null}}
  const useSplit=!bonusOnly&&!!m.rs&&RS!==null&&RC!==null&&RS+RC===R;
  const GR=nonneg(t.gr),GG=countG(t,G);
  const useCount=!bonusOnly&&GR!==null&&GG!==null&&GG>0&&GR<=GG;
  const rev=reverseGrape(t,m,G,B,R);
  const useRev=!bonusOnly&&!useCount&&rev&&rev.grapes>0&&rev.grapes<G;
  let BS,BC;{const c=nonneg(t.bc),s0=nonneg(t.bs);if(c!==null){BC=c<=B?c:null;BS=BC!==null?B-BC:null}else if(s0!==null){BS=s0<=B?s0:null;BC=BS!==null?B-BS:null}else{BS=null;BC=null}}
  const useBig=!bonusOnly&&!!m.sb&&BS!==null&&BC!==null&&BS+BC===B;
  const NC=nonneg(t.nc);
  const useNc=!bonusOnly&&!!m.ncr&&NC!==null&&GG!==null&&GG>0&&NC<=GG;
  const logs=[];
  for(let i=0;i<6;i++){
    const pb=1/m.b[i];let L;
    if(useBig){const ps1=1/m.sb[i]+1/m.sbx,pc1=pb-ps1;L=BS*Math.log(ps1)+BC*Math.log(pc1)}
    else L=B*Math.log(pb);
    if(useSplit){const a=1/m.rs[i],c=1/m.rc[i];L+=RS*Math.log(a)+RC*Math.log(c)+(G-B-R)*Math.log(1-pb-a-c)}
    else{const p=1/m.r[i];L+=R*Math.log(p)+(G-B-R)*Math.log(1-pb-p)}
    const q=1/m.gr[i];
    if(useCount)L+=GR*Math.log(q)+(GG-GR)*Math.log(1-q);
    else if(useRev)L+=0.5*(rev.grapes*Math.log(q)+(G-rev.grapes)*Math.log(1-q));
    if(useNc){const c=1/m.ncr[i];L+=NC*Math.log(c)+(GG-NC)*Math.log(1-c)}
    L+=Math.log(pr[i]/ps);logs.push(L);
  }
  const mx=Math.max(...logs);let s=0;const e=logs.map(l=>{const v=Math.exp(l-mx);s+=v;return v});
  const post=e.map(v=>v/s);
  return {m,G,B,R,post,useSplit,useCount,useRev,rev,RS,RC,GR,GG,useBig,BS,BC,useNc,NC};
}

function countG(t,G){const gg=nonneg(t.gg);if(gg!==null)return gg;const st=nonneg(t.gst);if(st!==null&&G!==null&&st<G)return G-st;return G}

function update(){
  const t=T(),m=MODELS[t.model];
  const G=nonneg(t.g),B=nonneg(t.b),R=nonneg(t.r);

const SCOL=["#8e8e93","#5ac8fa","#34c759","#ffcc00","#ff9500","#ff2d55"];
const sg=v=>(v>=0?"+":"−")+Math.abs(Math.round(v));
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

</script>
<script type="module">
const CFG={apiKey:"AIzaSyDIz2KLkmLZmhVl81sgaWdagL4taoePx-4",authDomain:"jugtool.firebaseapp.com",projectId:"jugtool",storageBucket:"jugtool.firebasestorage.app",messagingSenderId:"845582650761",appId:"1:845582650761:web:d7ad45749ff8d08d98e558"};
const V="11.0.2",U=`https://www.gstatic.com/firebasejs/${V}/`;
const $=id=>document.getElementById(id);
const sub=$("acctSub"),btn=$("acctBtn"),dlg=$("authDlg");
function status(txt,cls){sub.textContent=txt;sub.className=cls||""}
let A,F,auth,db,user=null,ref=null,unsub=null,timer=null,pending=false,mode="in";
const lts=()=>+(localStorage.getItem("jug-ts")||0);
const ERR={"auth/invalid-email":"メールアドレスの形式が正しくありません。","auth/invalid-credential":"メールアドレスかパスワードが違います。","auth/user-not-found":"メールアドレスかパスワードが違います。","auth/wrong-password":"メールアドレスかパスワードが違います。","auth/email-already-in-use":"このメールアドレスはすでに登録されています。「ログイン」から入ってください。","auth/weak-password":"パスワードは6文字以上にしてください。","auth/missing-password":"パスワードを入れてください。","auth/network-request-failed":"通信できませんでした。電波のある所でもう一度試してください。","auth/too-many-requests":"試行回数が多すぎます。少し時間をおいてください。","auth/unauthorized-domain":"このURLからのログインが許可されていません(管理者の設定が必要です)。","auth/operation-not-allowed":"メール/パスワードでのログインが有効になっていません(管理者の設定が必要です)。"};
const msg=e=>ERR[e&&e.code]||("エラーが発生しました"+(e&&e.code?`(${e.code})`:""));

async function push(){
  if(!user||!ref)return;
  clearTimeout(timer);
  const ts=lts()||Date.now();
  status(navigator.onLine?"保存中…":"オフライン。電波が戻ると自動で保存します","warn");
  try{
    await F.setDoc(ref,{data:JSON.stringify(JUG.getState()),updatedAt:ts,email:user.email||""});
    pending=false;localStorage.setItem("jug-sync-uid",user.uid);
    status(`${user.email} ・ クラウドに保存済み`,"ok");
  }catch(e){
    pending=true;status(navigator.onLine?"保存に失敗しました。自動でもう一度試します":"オフライン。電波が戻ると自動で保存します",navigator.onLine?"err":"warn");
    timer=setTimeout(push,15000);
  }
}
function apply(d){
  try{JUG.setState(JSON.parse(d.data));localStorage.setItem("jug-ts",String(d.updatedAt||Date.now()));localStorage.setItem("jug-sync-uid",user.uid);status(`${user.email} ・ クラウドと同期済み`,"ok")}
  catch(e){status("クラウドのデータを読み込めませんでした","err")}
}
function startSync(){
  ref=F.doc(db,"users",user.uid);
  let first=true;
  unsub=F.onSnapshot(ref,snap=>{
    if(snap.metadata.hasPendingWrites)return;
    const d=snap.data();
    if(!d){push();first=false;return}
    const rts=d.updatedAt||0;
    if(first&&localStorage.getItem("jug-sync-uid")!==user.uid&&JUG.hasData()&&rts!==lts()){
      first=false;
      const useCloud=confirm("この端末にも入力済みのデータがあります。\n\nOK:クラウドに保存されているデータを使う\nキャンセル:この端末のデータでクラウドを上書きする");
      if(useCloud)apply(d);else{localStorage.setItem("jug-ts",String(Date.now()));push()}
      return;
    }
    first=false;
    if(pending)return;
    if(rts>lts())apply(d);
    else if(rts<lts())push();
    else{localStorage.setItem("jug-sync-uid",user.uid);status(`${user.email} ・ クラウドと同期済み`,"ok")}
  },e=>status("クラウドに接続できません。データはこの端末に保存しています","warn"));
}
JUG.onSave=()=>{if(!user)return;pending=true;clearTimeout(timer);status("保存中…","warn");timer=setTimeout(push,1200)};
addEventListener("online",()=>{if(user&&pending)push()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&user&&pending)push()});

/* ---- UI ---- */
function setMode(m){mode=m;document.querySelectorAll("#authMode button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===m?"true":"false"));
  $("authTitle").textContent=m==="in"?"ログイン":"新規登録";$("authGo").textContent=m==="in"?"ログイン":"登録してログイン";
  $("authPass").autocomplete=m==="in"?"current-password":"new-password";$("authReset").style.display=m==="in"?"block":"none";$("authErr").textContent=""}
document.querySelectorAll("#authMode button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$("authClose").onclick=()=>dlg.close();
btn.onclick=async()=>{
  if(!auth){status("ログイン機能を読み込めませんでした。電波のある所で開き直してください","err");return}
  if(user){if(confirm("ログアウトしますか?\n(この端末のデータはそのまま残ります)")){await A.signOut(auth)}return}
  setMode("in");dlg.showModal?dlg.showModal():dlg.setAttribute("open","");
};
$("authForm").onsubmit=async ev=>{
  ev.preventDefault();
  const em=$("authEmail").value.trim(),pw=$("authPass").value;const go=$("authGo");
  if(!em){$("authErr").textContent="メールアドレスを入れてください。";return}
  go.disabled=true;$("authErr").textContent="";
  try{
    if(mode==="in")await A.signInWithEmailAndPassword(auth,em,pw);
    else await A.createUserWithEmailAndPassword(auth,em,pw);
    $("authPass").value="";dlg.close();
  }catch(e){$("authErr").textContent=msg(e)}finally{go.disabled=false}
};
$("authReset").onclick=async()=>{
  const em=$("authEmail").value.trim();
  if(!em){$("authErr").textContent="先にメールアドレスを入れてください。";return}
  try{A.useDeviceLanguage(auth);await A.sendPasswordResetEmail(auth,em);$("authErr").style.color="var(--green)";$("authErr").textContent="パスワード再設定のメールを送りました(届かない場合は迷惑メールも確認してください)。";setTimeout(()=>$("authErr").style.color="",8000)}
  catch(e){$("authErr").textContent=msg(e)}
};

/* ---- boot ---- */
(async()=>{
  try{
    const [app,a,f]=await Promise.all([import(U+"firebase-app.js"),import(U+"firebase-auth.js"),import(U+"firebase-firestore.js")]);
    A=a;F=f;
    const fa=app.initializeApp(CFG);
    auth=a.getAuth(fa);db=f.getFirestore(fa);
    a.onAuthStateChanged(auth,u=>{
      if(unsub){unsub();unsub=null}clearTimeout(timer);pending=false;
      user=u;
      if(u){btn.textContent="ログアウト";status(`${u.email} ・ 同期を確認中…`,"warn");startSync()}
      else{btn.textContent="ログイン";ref=null;status("ログインで記録をクラウド保存")}
    });
  }catch(e){
    btn.disabled=false;
    status(navigator.onLine?"ログイン機能を読み込めませんでした":"オフライン中。データはこの端末に保存しています","warn");
  }
})();
</script>

</body>
</html>
